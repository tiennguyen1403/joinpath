services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: joinpath
      POSTGRES_PASSWORD: joinpath
      POSTGRES_DB: joinpath
    ports:
      # 5433 on the host: 5432 is often taken by a locally installed Postgres
      - '5433:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U joinpath -d joinpath']
      interval: 2s
      timeout: 5s
      retries: 15

  # S3-compatible storage for documents (PLAN §6.2). MinIO no longer publishes images.
  # The bucket comes from `pnpm storage:init`.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: joinpath
      RUSTFS_SECRET_KEY: joinpath-local
    ports:
      - '9000:9000'
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/health']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  s3data:
