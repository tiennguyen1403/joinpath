name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: joinpath
          POSTGRES_PASSWORD: joinpath
          POSTGRES_DB: joinpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joinpath -d joinpath"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://joinpath:joinpath@localhost:5432/joinpath
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds core/dist and the Prisma client, which tests, typecheck and lint need.
      - run: pnpm build
      - run: pnpm --filter @joinpath/api exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
