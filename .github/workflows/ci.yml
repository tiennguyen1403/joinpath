name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services: &services
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: joinpath
          POSTGRES_PASSWORD: joinpath
          POSTGRES_DB: joinpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joinpath -d joinpath"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      # S3-compatible storage, as in docker-compose.yml.
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: joinpath
          RUSTFS_SECRET_KEY: joinpath-local
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env: &env
      DATABASE_URL: postgresql://joinpath:joinpath@localhost:5432/joinpath
      APP_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: joinpath
      S3_ACCESS_KEY_ID: joinpath
      S3_SECRET_ACCESS_KEY: joinpath-local
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds core/dist and the Prisma client, which tests, typecheck and lint need.
      - run: pnpm build
      - run: pnpm --filter @joinpath/api exec prisma migrate deploy
      - run: pnpm storage:init
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  # The E2E specs (PLAN §12) on what reaches main, beside the checks: the API and the web app
  # as `pnpm build` leaves them, in the runner's Chrome, with the same Postgres and storage.
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services: *services
    env: *env
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @joinpath/api exec prisma migrate deploy
      - run: pnpm storage:init
      - run: pnpm e2e
      # Traces show invitation links with their tokens, for a database gone with the job.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: apps/e2e/test-results
